<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inmex · vista 360</title><meta name="theme-color" content="#0b1120">
<style>
html,body{margin:0;height:100%;background:#0b1120;color:#f3f5f9;font:15px/1.4 system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;left:0;right:0;top:0;padding:10px 12px;background:linear-gradient(#0b1120ee,#0b112000);font-weight:700;z-index:2}
#top small{display:block;color:#9aa4b8;font-weight:400}
#prog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#141c2e;padding:12px 16px;border-radius:10px;z-index:2}
#bar{position:fixed;left:12px;right:12px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
#bar button,#bar a{min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid #ffffff22;background:#141c2e;color:#f3f5f9;font:inherit;font-weight:600;line-height:1.1;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
#bar a.wa{background:#25d366;border-color:#25d366;color:#05210f}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:10px;z-index:5}
[hidden]{display:none!important}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="top"><span id="tit">Vista 360 de prueba</span><small>Arrastrá para mirar alrededor · pellizcá para acercar</small></div>
<div id="prog">Cargando…</div>
<div id="bar">
  <button id="auto">↻ Girar sola</button>
  <a id="wa" class="wa" target="_blank" rel="noopener" hidden>💬 Consultar</a>
  <button id="share">Compartir</button>
  <button id="full">⛶ Pantalla completa</button>
</div>
<script type="module">
import * as THREE from 'three';
/* Parámetros:
   p = imagen 2:1 · t = título · v = grados de inclinación permitidos (sin logo: 12, solo la franja real)
   logo = 0 para no tapar piso y techo · c = desde qué ángulo tapa el logo (35) · l = imagen de logo propia
   w = WhatsApp para consultas · intro = 0 sin entrada animada */
const q=new URLSearchParams(location.search), D=Math.PI/180;
const src=q.get('p')||'ejemplo/calle360.jpg', conLogo=q.get('logo')!=='0';
const capA=(+(q.get('c')||35))*D;
const lim=(+(q.get('v')|| (conLogo ? 80 : 12)))*D;
const titulo=q.get('t')||'Vista 360 de prueba';
document.getElementById('tit').textContent=titulo; document.title='Inmex · '+titulo;
const toast=(t)=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);};

const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(50,1,.1,100);
let fovBase=50, fov=50;
function rs(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;fovBase=innerWidth<innerHeight?62:50;if(!intro)fov=Math.min(fov,fovBase+25);cam.updateProjectionMatrix();}
addEventListener('resize',rs);

// tapa de piso o techo: disco con el color del borde de la foto que se funde hacia el logo
function tapa(colorBorde, conTexto){
  const S=1024, cv=document.createElement('canvas'); cv.width=cv.height=S; const g=cv.getContext('2d');
  const gr=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  gr.addColorStop(0,'#0b1120'); gr.addColorStop(.62,'#0b1120'); gr.addColorStop(.86,colorBorde); gr.addColorStop(1,colorBorde.replace('rgb(','rgba(').replace(')',',0)'));
  g.fillStyle=gr; g.fillRect(0,0,S,S);
  if (conTexto){
    g.strokeStyle='#f2a516'; g.lineWidth=5; g.beginPath(); g.arc(S/2,S/2,S*.085,0,7); g.stroke();
    g.fillStyle='#f3f5f9'; g.textAlign='center'; g.textBaseline='middle';
    g.font='700 40px system-ui,sans-serif'; g.fillText('INMEX',S/2,S/2-8);
    g.fillStyle='#f2a516'; g.font='700 22px system-ui,sans-serif'; g.fillText('360',S/2,S/2+28);
  }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function ponerTapa(tex, abajo){
  const R=9.8, m=new THREE.Mesh(new THREE.CircleGeometry(R*Math.cos(capA)*1.04,64), new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));
  m.position.y=(abajo?-1:1)*R*Math.sin(capA); m.rotation.x=abajo?-Math.PI/2:Math.PI/2; if(!abajo) m.rotation.z=Math.PI; sc.add(m); return m;
}
function colorFilas(img, desde, hasta){
  const c=document.createElement('canvas'); c.width=64; c.height=32; const g=c.getContext('2d'); g.drawImage(img,0,0,64,32);
  const d=g.getImageData(0,Math.floor(desde*32),64,Math.max(1,Math.floor((hasta-desde)*32))).data; let R=0,G=0,B=0,n=0;
  for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];n++;}
  return `rgb(${Math.round(R/n)},${Math.round(G/n)},${Math.round(B/n)})`;
}
new THREE.TextureLoader().load(src,t=>{t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  const m=new THREE.Mesh(new THREE.SphereGeometry(10,96,64),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide}));
  m.scale.x=-1; sc.add(m);
  if (conLogo){
    const fila=a=>(90-a/D)/180; // fila de la imagen (0 = arriba) para una latitud en radianes
    ponerTapa(tapa(colorFilas(t.image, fila(capA+2*D), fila(capA-3*D)), false), false);
    const piso=tapa(colorFilas(t.image, fila(-capA+3*D), fila(-capA-2*D)), !q.get('l'));
    const dPiso=ponerTapa(piso, true);
    if (q.get('l')) new THREE.TextureLoader().load(q.get('l'), lt=>{ lt.colorSpace=THREE.SRGBColorSpace;
      const cv=piso.image, g=cv.getContext('2d'), S=cv.width, im=lt.image, k=Math.min(S*.16/im.width,S*.16/im.height);
      g.drawImage(im,S/2-im.width*k/2,S/2-im.height*k/2,im.width*k,im.height*k); piso.needsUpdate=true; dPiso.material.needsUpdate=true; });
  }
  document.getElementById('prog').remove(); empezar();});

// mirar: arrastrar, pellizcar, rueda
let lon=0,lat=0,x0,y0,l0,a0,drag=false,auto=true,pinch=null,intro=null;
const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;
function empezar(){ rs(); if (q.get('intro')==='0'||quieto){ fov=fovBase; return; } intro={t0:performance.now(), lat0: conLogo ? -Math.min(lim,70*D) : 0}; }
const enBarra=e=>e.target.closest&&e.target.closest('#bar');
addEventListener('pointerdown',e=>{if(enBarra(e))return;drag=true;auto=false;intro=null;x0=e.clientX;y0=e.clientY;l0=lon;a0=lat;btn();});
addEventListener('pointermove',e=>{if(!drag||pinch)return;const k=fov/innerHeight*D;lon=l0-(e.clientX-x0)*k;lat=Math.max(-lim,Math.min(lim,a0+(e.clientY-y0)*k));});
addEventListener('pointerup',()=>drag=false); addEventListener('pointercancel',()=>drag=false);
addEventListener('wheel',e=>{fov=Math.max(30,Math.min(fovBase+25,fov+e.deltaY*.03));intro=null;},{passive:true});
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
addEventListener('touchstart',e=>{if(e.touches.length===2){pinch={d:dist(e.touches),f:fov};intro=null;}},{passive:true});
addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2)fov=Math.max(30,Math.min(fovBase+25,pinch.f*pinch.d/dist(e.touches)));},{passive:true});
addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;});

// botones
const b=document.getElementById('auto'); function btn(){b.textContent=auto?'⏸ Parar':'↻ Girar sola';} btn();
b.onclick=()=>{auto=!auto;btn();};
function waNum(t){ let d=String(t||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('54')) return d; d=d.replace(/^0/,''); if(d.length===12){ for(const k of [2,3,4]) if(d.substr(k,2)==='15'){ d=d.slice(0,k)+d.slice(k+2); break; } } return '549'+d; }
const wn=waNum(q.get('w'));
if (wn){ const a=document.getElementById('wa'); a.href=`https://wa.me/${wn}?text=${encodeURIComponent('Hola, vi "'+titulo+'" en Inmex 360 y quiero más información.')}`; a.hidden=false; }
document.getElementById('share').onclick=async()=>{
  const datos={title:'Inmex · '+titulo, text:titulo+' en 360', url:location.href};
  try{ if(navigator.share){ await navigator.share(datos); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(location.href); toast('Link copiado. Pegalo en WhatsApp.'); }catch(e){ toast('Copiá el link de arriba para compartirlo.'); }
};
const fb=document.getElementById('full');
if (!document.documentElement.requestFullscreen) fb.hidden=true;
fb.onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); };
document.addEventListener('fullscreenchange',()=>{ fb.textContent=document.fullscreenElement?'Salir de pantalla completa':'⛶ Pantalla completa'; });

const ease=x=>1-Math.pow(1-x,3);
r.setAnimationLoop(()=>{
  if (intro){ const k=Math.min(1,(performance.now()-intro.t0)/2600), e=ease(k); fov=fovBase+40*(1-e); lat=intro.lat0*(1-e); lon=-0.6*(1-e); if(k>=1) intro=null; }
  else if(auto) lon+=.0015;
  cam.fov=fov; cam.updateProjectionMatrix();
  cam.lookAt(Math.cos(lat)*Math.sin(lon),Math.sin(lat),-Math.cos(lat)*Math.cos(lon));
  r.render(sc,cam);
});
window.__v360={get lat(){return lat;},set lat(v){lat=v;},get fov(){return fov;},get intro(){return intro;}};
</script></body></html>
